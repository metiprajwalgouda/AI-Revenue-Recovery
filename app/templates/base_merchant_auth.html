<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Merchant{% endblock %} - ShopDemo</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header merchant-header">
        <a href="/" class="logo">ShopDemo <span class="merchant-badge">Merchant</span></a>
    </header>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
